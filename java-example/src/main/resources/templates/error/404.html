<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page not found')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<main class="shell error-page">
  <p class="eyebrow">Error <span th:text="${status}">404</span></p>
  <h1>This page slipped between the lines.</h1>
  <p class="lede">The address may be outdated, or the page may have moved. The site itself is still here.</p>
  <a class="button" th:href="@{/}">Return home <span aria-hidden="true">→</span></a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
