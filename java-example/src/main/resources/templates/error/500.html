<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<main class="shell error-page">
  <p class="eyebrow">Error <span th:text="${status}">500</span></p>
  <h1>Something needs a second look.</h1>
  <p class="lede">We could not complete that request. No internal details are shown here; please try again in a moment.</p>
  <a class="button" th:href="@{/}">Return home <span aria-hidden="true">→</span></a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
