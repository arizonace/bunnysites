{{ define "main" }}
  <article class="article wrap">
    <a class="back-link" href="{{ "posts/" | relURL }}">← All posts</a>
    <header class="article-header"><p class="post-meta">{{ .Date | time.Format ":date_long" }} · {{ .ReadingTime }} min read</p><h1>{{ .Title }}</h1><p class="lede">{{ .Description }}</p></header>
    <div class="prose">{{ .Content }}</div>
  </article>
{{ end }}
