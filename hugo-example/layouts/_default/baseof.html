<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="wrap nav-wrap">
        <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>{{ site.Title }}</span>
        </a>
        <nav aria-label="Main navigation">
          <ul class="nav-list">
            {{ range site.Menus.main }}
              <li><a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a></li>
            {{ end }}
          </ul>
        </nav>
      </div>
    </header>
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>© {{ now.Year }} {{ site.Title }}. Made with Hugo.</p>
        <a href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Back to top ↑</a>
      </div>
    </footer>
  </body>
</html>
